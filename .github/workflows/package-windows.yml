name: Package Windows apps
run-name: "${{ inputs.app }} Windows package"
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to package from validated source
        type: choice
        required: true
        default: photocraft
        options: [photocraft, vectorcraft, filmcraft, lightcraft, printcraft, effectcraft, designcraft]
permissions:
  contents: read
concurrency:
  group: craft-package-${{ inputs.app }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build, test and package native Windows apps
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/craft-package-target
        run: ./package-windows.ps1 -App '${{ inputs.app }}'
      - name: Save Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.app }}-chatgpt-windows-x64
          path: packages/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
